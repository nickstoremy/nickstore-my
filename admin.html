
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NickStore.My | Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#eee;font-family:Arial,sans-serif}
header{padding:22px 6%;border-bottom:1px solid #292929;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:23px;font-weight:900;letter-spacing:1px}
.logo span{color:#aaa}
main{max-width:1000px;margin:35px auto;padding:0 18px}
h1{font-size:28px}
.muted{color:#888;font-size:13px}
.panel{background:#141414;border:1px solid #303030;border-radius:13px;padding:22px;margin:20px 0}
input,select,textarea{width:100%;padding:13px;margin:8px 0 16px;background:#090909;border:1px solid #383838;border-radius:7px;color:white;font-size:14px}
textarea{min-height:85px;resize:vertical}
label{font-size:13px;color:#bbb}
button{background:#eee;color:#080808;border:0;border-radius:7px;padding:12px 17px;font-weight:bold;cursor:pointer}
button.secondary{background:#292929;color:white}
button.danger{background:#762727;color:white}
button:disabled{opacity:.5}
.hidden{display:none!important}
.product{border:1px solid #333;padding:14px;border-radius:9px;margin:12px 0;display:flex;gap:14px;align-items:center}
.product img{width:85px;height:75px;object-fit:cover;border-radius:6px;background:#222}
.product-info{flex:1;min-width:0}
.product-info p{margin:5px 0;color:#aaa;font-size:13px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.actions button{padding:9px 12px;font-size:12px}
#message{margin:12px 0;color:#ddd;font-size:13px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
@media(max-width:550px){.product{align-items:flex-start}.product img{width:65px;height:65px}.product-info{font-size:13px}}
</style>
</head>
<body>

<header>
  <div class="logo">NICKSTORE<span>.MY</span></div>
  <button id="logoutBtn" class="secondary hidden">Logout</button>
</header>

<main>
  <section id="loginPanel" class="panel">
    <h1>Admin Login</h1>
    <p class="muted">NickStore.My management portal</p>
    <form id="loginForm">
      <label>Email</label>
      <input id="email" type="email" placeholder="Admin email" required>
      <label>Password</label>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">LOGIN</button>
    </form>
    <div id="loginMessage"></div>
  </section>

  <section id="dashboard" class="hidden">
    <div class="topline">
      <div>
        <h1>Dashboard</h1>
        <p class="muted">Manage your gaming listings</p>
      </div>
      <button id="newBtn">+ Add Product</button>
    </div>

    <div id="formPanel" class="panel hidden">
      <h2 id="formTitle">Add New Product</h2>
      <form id="productForm">
        <label>Game</label>
        <select id="game" required>
          <option value="MLBB">Mobile Legends (MLBB)</option>
          <option value="PUBG">PUBG Mobile</option>
        </select>

        <label>Product name</label>
        <input id="name" required placeholder="Example: MLBB Premium Account">

        <label>Description</label>
        <textarea id="description" placeholder="Account details, skins, rank, etc."></textarea>

        <label>Price (RM)</label>
        <input id="price" type="number" min="0" step="0.01" required placeholder="100">

        <label>Status</label>
        <select id="status">
          <option value="available">Available</option>
          <option value="reserved">Reserved</option>
          <option value="sold">Sold</option>
        </select>

        <label>Product image</label>
        <input id="image" type="file" accept="image/*">
        <p class="muted">Leave image empty when editing to keep the current image.</p>

        <div class="actions">
          <button type="submit" id="saveBtn">Save Product</button>
          <button type="button" class="secondary" id="cancelBtn">Cancel</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <div class="topline">
        <h2>All Products</h2>
        <button class="secondary" id="refreshBtn">Refresh</button>
      </div>
      <div id="productList">Loading products...</div>
    </div>
    <div id="message"></div>
  </section>
</main>

<script>
const SUPABASE_URL = "https://tvtnhyvhndocpjicukhw.supabase.co";
const SUPABASE_KEY = "sb_publishable_79X_gnANUwuMShTEXcVjEQ_N4c5n_Gr";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let editingId = null;

function message(text, error=false) {
  $("message").textContent = text;
  $("message").style.color = error ? "#ff8585" : "#ddd";
}

function showDashboard() {
  $("loginPanel").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");
  loadProducts();
}

async function checkLogin() {
  const {data:{session}} = await db.auth.getSession();
  if(session) showDashboard();
}

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginMessage").textContent = "Logging in...";
  const {error} = await db.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });
  if(error) {
    $("loginMessage").textContent = error.message;
  } else {
    $("loginMessage").textContent = "";
    showDashboard();
  }
});

$("logoutBtn").onclick = async () => {
  await db.auth.signOut();
  location.reload();
};

function resetForm() {
  editingId = null;
  $("productForm").reset();
  $("formTitle").textContent = "Add New Product";
  $("saveBtn").textContent = "Save Product";
  $("formPanel").classList.add("hidden");
}

$("newBtn").onclick = () => {
  resetForm();
  $("formPanel").classList.remove("hidden");
  $("formPanel").scrollIntoView({behavior:"smooth"});
};

$("cancelBtn").onclick = resetForm;
$("refreshBtn").onclick = loadProducts;

async function loadProducts() {
  $("productList").textContent = "Loading products...";
  const {data,error} = await db
    .from("products")
    .select("*")
    .order("created_at",{ascending:false});

  if(error) {
    $("productList").textContent = error.message;
    return;
  }

  if(!data.length) {
    $("productList").textContent = "No products yet. Add your first listing!";
    return;
  }

  $("productList").innerHTML = "";

  data.forEach(p => {
    const item = document.createElement("div");
    item.className = "product";

    const img = document.createElement("img");
    img.src = p.image_url || "";
    img.alt = "Product image";

    const info = document.createElement("div");
    info.className = "product-info";

    const title = document.createElement("strong");
    title.textContent = p.name;

    const detail = document.createElement("p");
    detail.textContent = p.game + " • RM" + Number(p.price).toFixed(2);

    const status = document.createElement("p");
    status.textContent = "Status: " + p.status.toUpperCase();

    info.append(title,detail,status);

    const actions = document.createElement("div");
    actions.className = "actions";

    const edit = document.createElement("button");
    edit.textContent = "Edit";
    edit.className = "secondary";
    edit.onclick = () => editProduct(p);

    const del = document.createElement("button");
    del.textContent = "Delete";
    del.className = "danger";
    del.onclick = () => deleteProduct(p.id);

    actions.append(edit,del);
    item.append(img,info,actions);
    $("productList").append(item);
  });
}

function editProduct(p) {
  editingId = p.id;
  $("game").value = p.game;
  $("name").value = p.name;
  $("description").value = p.description || "";
  $("price").value = p.price;
  $("status").value = p.status;
  $("image").value = "";
  $("formTitle").textContent = "Edit Product";
  $("saveBtn").textContent = "Update Product";
  $("formPanel").classList.remove("hidden");
  $("formPanel").scrollIntoView({behavior:"smooth"});
}

async function deleteProduct(id) {
  if(!confirm("Delete this product?")) return;

  const {error} = await db.from("products").delete().eq("id",id);

  if(error) {
    message(error.message,true);
  } else {
    message("Product deleted.");
    loadProducts();
  }
}

$("productForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("saveBtn").disabled = true;
  message("Saving product...");

  try {
    let imageUrl = null;

    if(editingId) {
      const {data,error} = await db.from("products")
        .select("image_url").eq("id",editingId).single();
      if(error) throw error;
      imageUrl = data.image_url;
    }

    const file = $("image").files[0];

    if(file) {
      if(!file.type.startsWith("image/")) {
        throw new Error("Please choose an image file.");
      }
      if(file.size > 5*1024*1024) {
        throw new Error("Image must be smaller than 5 MB.");
      }

      const path = Date.now() + "-" + crypto.randomUUID() + "-" +
        file.name.replace(/[^a-zA-Z0-9._-]/g,"_");

      const {error:uploadError} = await db.storage
        .from("product-images")
        .upload(path,file);

      if(uploadError) throw uploadError;

      const {data} = db.storage.from("product-images").getPublicUrl(path);
      imageUrl = data.publicUrl;
    }

    const product = {
      game:$("game").value,
      name:$("name").value.trim(),
      description:$("description").value.trim(),
      price:Number($("price").value),
      status:$("status").value,
      image_url:imageUrl
    };

    const result = editingId
      ? await db.from("products").update(product).eq("id",editingId)
      : await db.from("products").insert(product);

    if(result.error) throw result.error;

    message("Product saved successfully!");
    resetForm();
    await loadProducts();

  } catch(error) {
    message(error.message,true);
  } finally {
    $("saveBtn").disabled = false;
  }
});

checkLogin();
</script>
</body>
</html>
