
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NickStore.My | Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#080808;color:#eee;font-family:Arial,sans-serif}
.container{max-width:1000px;margin:auto}
h1,h2{color:#fff}
h1 span{color:#aaa}
.card{background:#151515;border:1px solid #333;border-radius:12px;padding:22px;margin-bottom:22px}
input,select,textarea{width:100%;padding:13px;margin:8px 0 16px;background:#080808;border:1px solid #444;border-radius:7px;color:white;font-size:14px}
textarea{min-height:110px;resize:vertical}
label{font-size:13px;color:#ccc;font-weight:bold}
button{padding:12px 18px;border:none;border-radius:7px;background:#ddd;color:#111;font-weight:bold;cursor:pointer;margin:4px}
button:hover{opacity:.8}
button:disabled{opacity:.5}
.danger{background:#8b2020;color:white}
.secondary{background:#333;color:white}
.muted{color:#888;font-size:12px;margin-top:-10px;margin-bottom:15px}
.hidden{display:none}
.product{display:flex;align-items:center;gap:15px;border-bottom:1px solid #333;padding:15px 0}
.product img{width:75px;height:75px;object-fit:cover;border-radius:8px;background:#222}
.product-info{flex:1;min-width:0}
.product-info p{color:#999;font-size:13px;margin:5px 0}
#message{margin:12px 0;font-size:14px;color:#9be69b;overflow-wrap:anywhere}
@media(max-width:600px){
body{padding:12px}
.product{align-items:flex-start}
.product img{width:60px;height:60px}
button{padding:10px 12px}
}
</style>
</head>

<body>
<div class="container">

<h1>NICKSTORE<span>.MY</span></h1>
<p class="muted">ADMIN CONTROL PANEL</p>

<div id="loginSection" class="card">
<h2>Admin Login</h2>
<form id="loginForm">
<label>Email</label>
<input id="email" type="email" required placeholder="Admin email">
<label>Password</label>
<input id="password" type="password" required placeholder="Password">
<button type="submit">LOGIN</button>
</form>
</div>

<div id="dashboard" class="hidden">

<div class="card">
<h2>Dashboard</h2>
<p class="muted">Manage your NickStore listings.</p>
<button class="secondary" id="logoutBtn">LOGOUT</button>
</div>

<div class="card">
<h2 id="formTitle">Add New Product</h2>

<form id="productForm">

<label>Game</label>
<select id="game" required>
<option value="MLBB">Mobile Legends</option>
<option value="PUBG">PUBG Mobile</option>
</select>

<label>Product Name</label>
<input id="name" type="text" required placeholder="Example: MLBB Account Mythical Glory">

<label>Description</label>
<textarea id="description" placeholder="Short product description"></textarea>

<label>Price (RM)</label>
<input id="price" type="number" min="0" step="0.01" required placeholder="Example: 150">

<label>Status</label>
<select id="status">
<option value="available">Available</option>
<option value="reserved">Reserved</option>
<option value="sold">Sold</option>
</select>

<label>Cover Image</label>
<input id="image" type="file" accept="image/*">
<p class="muted">Main image shown on the product card.</p>

<label>Album Images (Multiple)</label>
<input id="gallery" type="file" accept="image/*" multiple>
<p class="muted">Select multiple screenshots for the account album.</p>

<label>Full Specifications</label>
<textarea id="specifications" placeholder="Rank: Mythical Glory
Total Skins: 120
Total Heroes: 98
Rare Skins: 15
Account Level: 75
Login Method: Moonton"></textarea>
<p class="muted">One specification per line.</p>

<button id="saveBtn" type="submit">SAVE PRODUCT</button>
<button type="button" class="secondary" id="cancelBtn">CANCEL</button>

</form>
<div id="message"></div>
</div>

<div class="card">
<h2>Product Listings</h2>
<div id="productList">Loading products...</div>
</div>

</div>
</div>

<script>
const SUPABASE_URL = "https://tvtnhyvhndocpjicukhw.supabase.co";
const SUPABASE_KEY = "sb_publishable_79X_gnANUwuMShTEXcVjEQ_N4c5n_Gr";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let editingId = null;

function message(text,error=false){
  $("message").textContent=text;
  $("message").style.color=error?"#ff7777":"#9be69b";
}

function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,char=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  })[char]);
}

async function checkLogin(){
  const {data:{session}}=await db.auth.getSession();

  if(session){
    $("loginSection").classList.add("hidden");
    $("dashboard").classList.remove("hidden");
    await loadProducts();
  }else{
    $("loginSection").classList.remove("hidden");
    $("dashboard").classList.add("hidden");
  }
}

$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const {error}=await db.auth.signInWithPassword({
    email:$("email").value,
    password:$("password").value
  });

  if(error){
    alert(error.message);
    return;
  }

  await checkLogin();
});

$("logoutBtn").addEventListener("click",async()=>{
  await db.auth.signOut();
  location.reload();
});

async function loadProducts(){
  const {data,error}=await db.from("products")
    .select("*").order("created_at",{ascending:false});

  if(error){
    $("productList").textContent=error.message;
    return;
  }

  if(!data||data.length===0){
    $("productList").textContent="No products yet. Add your first listing!";
    return;
  }

  $("productList").innerHTML=data.map(p=>`
    <div class="product">
      <img src="${escapeHTML(p.image_url||"")}" alt="Product image">
      <div class="product-info">
        <strong>${escapeHTML(p.name)}</strong>
        <p>${escapeHTML(p.game)} | RM${Number(p.price).toFixed(2)}</p>
        <p>Status: ${escapeHTML(p.status)}</p>
      </div>
      <div>
        <button onclick="editProduct('${p.id}')">EDIT</button>
        <button class="danger" onclick="deleteProduct('${p.id}')">DELETE</button>
      </div>
    </div>
  `).join("");
}

async function editProduct(id){
  const {data:p,error}=await db.from("products")
    .select("*").eq("id",id).single();

  if(error){
    alert(error.message);
    return;
  }

  editingId=id;
  $("game").value=p.game||"MLBB";
  $("name").value=p.name||"";
  $("description").value=p.description||"";
  $("price").value=p.price||"";
  $("status").value=(p.status||"available").toLowerCase();

  const specs=p.specifications||{};
  $("specifications").value=Object.entries(specs)
    .map(([key,value])=>key+": "+value).join("\n");

  $("image").value="";
  $("gallery").value="";
  $("formTitle").textContent="Edit Product";
  $("saveBtn").textContent="UPDATE PRODUCT";

  window.scrollTo({top:0,behavior:"smooth"});
}

function resetForm(){
  editingId=null;
  $("productForm").reset();
  $("formTitle").textContent="Add New Product";
  $("saveBtn").textContent="SAVE PRODUCT";
  message("");
}

$("cancelBtn").addEventListener("click",resetForm);

async function uploadImage(file){
  if(!file.type.startsWith("image/")){
    throw new Error("Please select an image.");
  }

  if(file.size>5*1024*1024){
    throw new Error("Each image must be smaller than 5 MB.");
  }

  const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const path=Date.now()+"-"+crypto.randomUUID()+"-"+safeName;

  const {error}=await db.storage.from("product-images").upload(path,file);
  if(error)throw error;

  return db.storage.from("product-images").getPublicUrl(path).data.publicUrl;
}

$("productForm").addEventListener("submit",async e=>{
  e.preventDefault();

  $("saveBtn").disabled=true;
  message("Saving product...");

  try{
    let imageUrl=null;
    let galleryUrls=[];

    if(editingId){
      const {data,error}=await db.from("products")
        .select("image_url,gallery_urls")
        .eq("id",editingId).single();

      if(error)throw error;

      imageUrl=data.image_url||null;
      galleryUrls=Array.isArray(data.gallery_urls)?data.gallery_urls:[];
    }

    const coverFile=$("image").files[0];

    if(coverFile){
      imageUrl=await uploadImage(coverFile);
    }

    const galleryFiles=Array.from($("gallery").files);

    for(const photo of galleryFiles){
      galleryUrls.push(await uploadImage(photo));
    }

    const specs={};

    $("specifications").value.split("\n").forEach(line=>{
      const separator=line.indexOf(":");

      if(separator>-1){
        const key=line.slice(0,separator).trim();
        const value=line.slice(separator+1).trim();

        if(key&&value)specs[key]=value;
      }
    });

    const product={
      game:$("game").value,
      name:$("name").value.trim(),
      description:$("description").value.trim(),
      price:Number($("price").value),
      status:$("status").value,
      image_url:imageUrl,
      gallery_urls:galleryUrls,
      specifications:specs
    };

    const result=editingId
      ?await db.from("products").update(product).eq("id",editingId)
      :await db.from("products").insert(product);

    if(result.error)throw result.error;

    message("Product saved successfully!");
    resetForm();
    await loadProducts();

  }catch(error){
    message(error.message,true);
  }finally{
    $("saveBtn").disabled=false;
  }
});

async function deleteProduct(id){
  if(!confirm("Are you sure you want to delete this product?"))return;

  const {error}=await db.from("products").delete().eq("id",id);

  if(error){
    alert(error.message);
    return;
  }

  await loadProducts();
}

checkLogin();
</script>
</body>
</html>
